<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="800" fill="#f5f3ef"/>
  <text x="600" y="62" text-anchor="middle" font-size="36" font-weight="bold" fill="#1f2937">HP 12C — Teclas Financeiras</text>
  <text x="600" y="98" text-anchor="middle" font-size="18" fill="#4b5563">Guia rápido de Matemática Financeira</text>

  <!-- Linha 1: registradores financeiros -->
  <g font-weight="bold" text-anchor="middle">
    <g transform="translate(110,140)">
      <rect width="160" height="90" rx="10" fill="#262626"/><text x="80" y="57" font-size="34" fill="#fff">n</text>
      <text x="80" y="122" font-size="16" fill="#1f2937">Nº de períodos</text>
    </g>
    <g transform="translate(310,140)">
      <rect width="160" height="90" rx="10" fill="#262626"/><text x="80" y="57" font-size="34" fill="#fff">i</text>
      <text x="80" y="122" font-size="16" fill="#1f2937">Taxa por período (%)</text>
    </g>
    <g transform="translate(510,140)">
      <rect width="160" height="90" rx="10" fill="#262626"/><text x="80" y="57" font-size="34" fill="#fff">PV</text>
      <text x="80" y="122" font-size="16" fill="#1f2937">Valor presente</text>
    </g>
    <g transform="translate(710,140)">
      <rect width="160" height="90" rx="10" fill="#262626"/><text x="80" y="57" font-size="34" fill="#fff">PMT</text>
      <text x="80" y="122" font-size="16" fill="#1f2937">Parcela / pagamento</text>
    </g>
    <g transform="translate(910,140)">
      <rect width="160" height="90" rx="10" fill="#262626"/><text x="80" y="57" font-size="34" fill="#fff">FV</text>
      <text x="80" y="122" font-size="16" fill="#1f2937">Valor futuro</text>
    </g>
  </g>

  <!-- Funções f (dourado) e g (azul) -->
  <text x="110" y="330" font-size="22" font-weight="bold" fill="#1f2937">Funções secundárias</text>
  <g font-size="18" fill="#1f2937">
    <rect x="110" y="350" width="36" height="30" rx="6" fill="#d97706"/><text x="128" y="371" text-anchor="middle" fill="#fff" font-weight="bold">f</text>
    <text x="160" y="372">f CLEAR FIN — limpa n, i, PV, PMT, FV</text>
    <rect x="110" y="392" width="36" height="30" rx="6" fill="#d97706"/><text x="128" y="413" text-anchor="middle" fill="#fff" font-weight="bold">f</text>
    <text x="160" y="414">f CLEAR REG — limpa tudo (inclusive fluxos de caixa)</text>
    <rect x="110" y="434" width="36" height="30" rx="6" fill="#d97706"/><text x="128" y="455" text-anchor="middle" fill="#fff" font-weight="bold">f</text>
    <text x="160" y="456">f NPV — VPL  ·  f IRR — TIR  ·  f INT — juros simples</text>

    <rect x="110" y="476" width="36" height="30" rx="6" fill="#0284c7"/><text x="128" y="497" text-anchor="middle" fill="#fff" font-weight="bold">g</text>
    <text x="160" y="498">g CF0 / g CFj / g Nj — fluxo inicial, fluxos e repetições</text>
    <rect x="110" y="518" width="36" height="30" rx="6" fill="#0284c7"/><text x="128" y="539" text-anchor="middle" fill="#fff" font-weight="bold">g</text>
    <text x="160" y="540">g BEG — antecipado (com entrada)  ·  g END — postecipado</text>
    <rect x="110" y="560" width="36" height="30" rx="6" fill="#0284c7"/><text x="128" y="581" text-anchor="middle" fill="#fff" font-weight="bold">g</text>
    <text x="160" y="582">g 12× / g 12÷ — converte n e i de anual para mensal</text>
  </g>

  <!-- Convenção de sinais -->
  <rect x="760" y="310" width="330" height="290" rx="16" fill="#fff" stroke="#d1d5db"/>
  <text x="925" y="350" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Convenção de sinais</text>
  <line x1="800" y1="460" x2="1050" y2="460" stroke="#1f2937" stroke-width="3"/>
  <line x1="820" y1="460" x2="820" y2="390" stroke="#16a34a" stroke-width="4"/>
  <polygon points="810,395 830,395 820,378" fill="#16a34a"/>
  <text x="840" y="400" font-size="16" fill="#16a34a">entrada = +</text>
  <line x1="1030" y1="460" x2="1030" y2="530" stroke="#dc2626" stroke-width="4"/>
  <polygon points="1020,525 1040,525 1030,542" fill="#dc2626"/>
  <text x="1015" y="530" font-size="16" text-anchor="end" fill="#dc2626">saída = − (CHS)</text>
  <text x="925" y="580" text-anchor="middle" font-size="15" fill="#4b5563">PV e FV devem ter sinais opostos</text>

  <!-- Exemplo -->
  <rect x="110" y="630" width="980" height="120" rx="16" fill="#1f2937"/>
  <text x="140" y="670" font-size="18" font-weight="bold" fill="#fbbf24">Exemplo: R$ 1.000 a 2% a.m. por 6 meses (juros compostos)</text>
  <text x="140" y="712" font-size="22" font-family="Courier New, monospace" fill="#fff">f CLEAR FIN  1000 CHS PV  2 i  6 n  FV  →  1.126,16</text>
</svg>
